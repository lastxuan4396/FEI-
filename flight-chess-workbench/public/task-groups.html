function render(){const q=$('q').value.trim().toLowerCase(),type=$('type').value;current=GROUPS.filter(g=>(!q||JSON.stringify(g.rows).toLowerCase().includes(q))&&(type==='all'||MATCHES[g.key].includes(type)));$('count').textContent='显示'+current.length+'组 · 共'+current.reduce((n,g)=>n+g.rows.length,0)+'条原文';$('groups').replaceChildren();for(const g of current){const card=el('article');card.className='group';card.dataset.key=g.key;card.append(el('p',g.category+' · '+g.rows.length+'个原文版本'),el('h2',g.template.replace(/〔(?:时长|次数|回合)(\d+)〕/g,(_,n)=>'〈'+DETAILS[g.key][Number(n)-1].label.split('（')[0]+'〉')));const preview=el('p',execute(g.rows[0],g));preview.className='preview';const fields=el('div'),info=DETAILS[g.key];fields.className='fields';g.parts.forEach((p,i)=>{const label=el('label',info[i].label+' · 第'+(i+1)+'段'),input=el('input');input.type='number';input.min=1;input.max=p.kind==='time'?86400:9999;input.value=prefs[g.key]?.[i]??'';input.placeholder=p.value===null?'保留原值':String(p.value);input.setAttribute('aria-label',g.template+'参数'+(i+1));input.oninput=()=>{const value=input.value===''?null:Number(input.value);if(value!==null&&(!Number.isInteger(value)||value<1||value>Number(input.max))){input.setCustomValidity('请输入范围内的整数');input.reportValidity();return}input.setCustomValidity('');const values=prefs[g.key]?.slice()||g.parts.map(()=>null);values[i]=value;prefs[g.key]=values;save();preview.textContent=execute(g.rows[0],g)};label.append(el('small','原值：'+info[i].tokens.join(' · ')),input,el('small',info[i].mixedUnits?'各原文保留自己的单位，填写后使用同一数值。':'留空保留每条原值，填写后统一本组数值。'));fields.append(label)});card.append(fields,preview);const details=el('details');details.append(el('summary','全部原文和来源 · '+g.rows.length+'条'));for(const r of g.rows){const item=el('div');item.className='original';item.append(el('b',r.id+' · '+r.status),el('p',r.text),el('small',r.sources.join('；')));details.append(item)}card.append(details);if(g.parts.length){const reset=el('button','恢复本组原文参数');reset.onclick=( function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('q').oninput=render;$('type').onchange=render;$('export').onclick=()=>download(JSON.stringify({format:'task-parameters',version:1,parameters:prefs},null,2),'我的任务参数.json','application/json');$('csv').onclick=()=>{const rows=[['编号','分类','原文','我的执行版','来源'],...current.flatMap(g=>g.rows.map(r=>[r.id,r.category,r.text,execute(r,g),r.sources.join('；')]))];download('\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'自定义任务执行版.csv','text/csv;charset=utf-8')};render();</script></html>
